[project]
name = "wechat-message-mcp"
version = "0.1.0"
description = "基于 Mac 本地数据库的微信聊天记录 MCP Server"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.3.0",
    "pycryptodome>=3.20.0",
    "zstandard>=0.23.0",
]

[project.scripts]
wechat-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
