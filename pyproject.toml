[project]
name = "wechat-message-mcp"
version = "0.2.0"
description = "微信聊天记录 MCP Server，支持 macOS 和 Windows"
requires-python = ">=3.11"
dependencies = [
    "av>=18.0.0",
    "frida>=17.16.4",
    "mcp[cli]>=1.3.0,<2.0.0",
    "pefile>=2024.8.26",
    "pilk>=0.2.4",
    "pillow>=12.3.0",
    "pycryptodome>=3.20.0",
    "pymem>=1.14.0",
    "sherpa-onnx>=2.0.1",
    "yara-python>=4.5.4",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
# Windows 平台额外依赖（pywin32 用于注册表读取）
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
wechat-mcp = "src.server:main"
wechatq = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = []
